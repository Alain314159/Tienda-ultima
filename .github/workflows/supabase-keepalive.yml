# El proyecto gratis de Supabase se pausa si durante una semana recibe pocas
# peticiones; su guia de pausas dice que bastan unas pocas al dia. Este flujo
# corre cuatro veces al dia y hace tres peticiones cada vez.
# Ademas renueva la actividad del repositorio cada ~45 dias con un commit vacio
# en la rama `keepalive`: GitHub apaga los horarios de los repositorios publicos
# que llevan 60 dias sin actividad.
# OJO: el horario solo corre si este archivo esta en la rama principal del repo.
name: Supabase keepalive

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      forzar_renovacion:
        description: 'Crear ahora el commit de renovacion (para probar el mecanismo)'
        type: boolean
        default: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Peticiones a la nube
        env:
          URL_NUBE: https://chstqhjoizljlpgehdkn.supabase.co
          CLAVE_PUBLICA: sb_publishable_kCpHDw6NQJgSU7P2yJSAAQ_fs7UjLvs
        run: |
          fallos=0
          for i in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$URL_NUBE/rest/v1/rpc/sync_latido" \
              -H "apikey: $CLAVE_PUBLICA" -H "Authorization: Bearer $CLAVE_PUBLICA" \
              -H 'Content-Type: application/json' -d '{}')
            echo "latido $i: HTTP $codigo"
            if [ "$codigo" != "200" ]; then fallos=$((fallos + 1)); fi
            sleep 5
          done
          echo "fallos: $fallos de 3"
          test "$fallos" -eq 0

  renovar:
    needs: ping
    if: github.event_name == 'schedule' || inputs.forzar_renovacion
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Renovar actividad si pasaron 45 dias
        env:
          GH_TOKEN: ${{ github.token }}
          FORZAR: ${{ inputs.forzar_renovacion }}
        run: |
          ultimo=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=keepalive&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || echo 1970-01-01T00:00:00Z)
          dias=$(( ( $(date +%s) - $(date -d "$ultimo" +%s) ) / 86400 ))
          echo "ultima actividad de keepalive hace $dias dias"
          if [ "$dias" -lt 45 ] && [ "$FORZAR" != "true" ]; then
            echo "todavia no hace falta"
            exit 0
          fi
          rama=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          arbol=$(gh api "repos/$GITHUB_REPOSITORY/commits/$rama" --jq .commit.tree.sha)
          commit=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message='chore: mantener activo el horario de Supabase keepalive' -f tree="$arbol" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/git/refs/heads/keepalive" -F force=true -f sha="$commit" 2>/dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/keepalive -f sha="$commit"
          echo "actividad renovada con el commit $commit"
