name: Quality gates

on:
  workflow_call:

jobs:
  quality:
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, cero advertencias)
        run: npm run lint

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Tests unitarios (Vitest + cobertura con umbrales)
        run: npm run test:coverage

      - name: Build de produccion
        run: npm run build
        env:
          NODE_ENV: production
          VITE_TG_APP_KEY: ${{ secrets.VITE_TG_APP_KEY }}
