name: CI

# Quality gates para PRs. Los pushes a las ramas de entrega los cubre
# deploy.yml (pipeline completo: gates → build web + Pages → APK firmado).
on:
  pull_request:

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  e2e:
    name: E2E + Lighthouse
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
